<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CurioCrew — Артефакты</title><link rel="stylesheet" href="styles.css"></head><body data-kind="artifact">
<header><a class="brand" href="index.html"><h1>CurioCrew</h1><p>Игровая база</p></a><div class="header-actions"><nav class="site-nav"><a class="" href="index.html">Разработка</a><a class="active" href="artifacts.html">Артефакты</a><a class="" href="royal-artifacts.html">Королевские артефакты</a><a class="" href="islands.html">Острова</a><a class="" href="mobs.html">Мобы</a></nav><button id="addItem" class="primary">+ Добавить</button></div></header>
<main><section class="page-hero"><span class="eyebrow">CurioCrew • база контента</span><h2>Каталог обычных артефактов</h2><p>Фиксируем внешний вид, редкость, функции, эффекты, опасность и то, как предмет ведёт себя при транспортировке.</p></section><div class="statusline"><span id="connection">Подключение…</span></div><div class="page-toolbar"><nav class="filters"><button class="filter active" data-filter="all">Все</button><button class="filter" data-filter="idea">Идея</button><button class="filter" data-filter="planned">Запланировано</button><button class="filter" data-filter="doing">В разработке</button><button class="filter" data-filter="done">Готово</button></nav><label class="search"><input id="search" placeholder="Поиск..."></label></div><section id="catalog" class="catalog-grid"></section></main>
<dialog id="dialog"><form id="form"><h2 id="formTitle">Новая запись</h2><input id="id" type="hidden"><div class="form-grid"><label class="wide">Название<input id="title" required></label><label class="wide">Описание<textarea id="description" rows="4"></textarea></label><label>Статус<select id="status"><option value="idea">Идея</option><option value="planned">Запланировано</option><option value="doing">В разработке</option><option value="done">Готово</option></select></label><label>Теги через запятую<input id="tags" placeholder="например: остров 1, хоррор"></label><label class="wide">Ссылка на картинку<input id="image" placeholder="https://..."></label><div id="detailFields" class="wide form-grid"></div></div><div class="actions"><button type="button" id="delete" class="danger hidden">Удалить</button><span></span><button type="button" id="cancel">Отмена</button><button type="submit" class="primary">Сохранить</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="catalog.js"></script></body></html>
