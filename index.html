<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CurioCrew — разработка</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div><h1>CurioCrew</h1><p>Трекер разработки</p></div>
  <button id="addTask">+ Добавить задачу</button>
</header>

<main>
  <div class="statusline"><span id="connection">Подключение…</span></div>

  <nav>
    <button class="filter active" data-filter="all">Все</button>
    <button class="filter" data-filter="planned">Запланировано</button>
    <button class="filter" data-filter="doing">В разработке</button>
    <button class="filter" data-filter="done">Сделано</button>
    <button class="filter" data-filter="cancelled">Не делаем</button>
  </nav>

  <section id="tasks"></section>
</main>

<dialog id="dialog">
  <form id="form">
    <h2 id="formTitle">Новая задача</h2>
    <input id="id" type="hidden">
    <label>Название<input id="title" required></label>
    <label>Описание<textarea id="description" rows="4"></textarea></label>
    <label>Статус
      <select id="status">
        <option value="planned">Запланировано</option>
        <option value="doing">В разработке</option>
        <option value="done">Сделано</option>
        <option value="cancelled">Не делаем</option>
      </select>
    </label>
    <label>Ссылка на картинку<input id="image" placeholder="https://..."></label>
    <div class="actions">
      <button type="button" id="delete" class="danger hidden">Удалить</button>
      <span></span>
      <button type="button" id="cancel">Отмена</button>
      <button type="submit" class="primary">Сохранить</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
